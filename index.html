<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR 永続表示 ＆ 撮影機能付き</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
    }

    /* グラスモーフィズム調のステータス表示 */
    #info-overlay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 15, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #f7f3ed;
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid rgba(228, 195, 139, 0.4);
      font-size: 11px;
      letter-spacing: 0.1em;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      white-space: nowrap;
    }
    #status { font-weight: 500; color: #e4c38b; }

    /* 最高級メタリック調のシャッターボタン */
    #shutter-container {
      position: absolute;
      bottom: 45px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 10;
    }
    #shutter-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95);
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      outline: none;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.4);
    }
  </style>

  <!-- A-Frame & MindAR ライブラリ -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div id="info-overlay">
    <div>AR CAMERA: <span id="status">カメラ起動中...</span></div>
    <div style="margin-top: 2px; font-size: 8.5px; color: rgba(255,255,255,0.6);">一度マーカーを読めば、消えずに常時表示されます</div>
  </div>

  <div id="shutter-container">
    <button id="shutter-btn" title="Capture"></button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    renderer="preserveDrawingBuffer: true, colorManagement: true">

    <a-assets>
      <a-asset-item id="houseModel" src="house.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- マーカー認識ターゲット -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <!-- 家の3Dモデル（初期状態は非表示） -->
      <a-gltf-model 
        id="houseMesh" 
        src="#houseModel" 
        position="0 0 0" 
        scale="0.25 0.25 0.25" 
        rotation="0 0 0"
        visible="false">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const sceneEl = document.querySelector('a-scene');
    const houseMesh = document.querySelector('#houseMesh');
    const targetEntity = document.querySelector('#targetEntity');
    const shutterBtn = document.getElementById('shutter-btn');

    let isLocked = false; // 一度マーカーを認識したかどうかのフラグ

    sceneEl.addEventListener("arReady", () => {
      statusEl.textContent = "READY - マーカーをかざしてください";
    });

    // マーカーを初めて認識した瞬間
    targetEntity.addEventListener('targetFound', () => {
      if (!isLocked) {
        isLocked = true;
        statusEl.textContent = '固定表示中（消えません）';

        // 1. 家のモデルを常時表示（visible = true）にする
        houseMesh.setAttribute('visible', 'true');

        // 2. 重要：マーカー要素（targetEntity）の親から外し、カメラシーン直下に移動させる
        // これにより、マーカーがカメラから外れても位置がリセットされず、その場に留まり続けます
        const worldPos = new THREE.Vector3();
        const worldRot = new THREE.Quaternion();
        const worldScale = new THREE.Vector3();
        
        houseMesh.object3D.matrixWorld.decompose(worldPos, worldRot, worldScale);
        
        sceneEl.object3D.add(houseMesh.object3D);
        houseMesh.object3D.position.copy(worldPos);
        houseMesh.object3D.quaternion.copy(worldRot);
        houseMesh.object3D.scale.copy(worldScale);
      }
    });

    // --- タッチ操作（1本指全方向回転 ＆ 2本指ピンチ拡大縮小） ---
    let startX = null;
    let startY = null;
    let currentRotX = 0;
    let currentRotY = 0;
    let initialDistance = null;
    let initialScale = 0.25;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (houseMesh) {
          const s = houseMesh.getAttribute('scale');
          if (s) initialScale = s.x;
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!houseMesh) return;

      if (e.touches.length === 1 && startX !== null && startY !== null) {
        const deltaX = e.touches[0].clientX - startX;
        const deltaY = e.touches[0].clientY - startY;
        currentRotY += deltaX * 0.5;
        currentRotX += deltaY * 0.5;
        houseMesh.setAttribute('rotation', `${currentRotX} ${currentRotY} 0`);
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      } else if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        let newScale = Math.max(0.05, Math.min(2.0, initialScale * factor));
        houseMesh.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      startX = null;
      startY = null;
      initialDistance = null;
    });

    // --- シャッター撮影機能 ---
    shutterBtn.addEventListener('click', () => {
      const videoEl = document.querySelector('video');
      const arCanvas = sceneEl.renderer.domElement;

      const saveCanvas = document.createElement('canvas');
      saveCanvas.width = arCanvas.width;
      saveCanvas.height = arCanvas.height;
      const saveCtx = saveCanvas.getContext('2d');

      if (videoEl && videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
        const vRatio = videoEl.videoWidth / videoEl.videoHeight;
        const cRatio = saveCanvas.width / saveCanvas.height;
        let w = saveCanvas.width, h = saveCanvas.height, x = 0, y = 0;
        if (vRatio > cRatio) {
          w = saveCanvas.height * vRatio;
          x = (saveCanvas.width - w) / 2;
        } else {
          h = saveCanvas.width / vRatio;
          y = (saveCanvas.height - h) / 2;
        }
        saveCtx.drawImage(videoEl, x, y, w, h);
      }

      saveCtx.drawImage(arCanvas, 0, 0);

      const link = document.createElement('a');
      link.download = 'ar_snapshot_' + Date.now() + '.png';
      link.href = saveCanvas.toDataURL('image/png', 1.0);
      link.click();
    });
  </script>
</body>
</html>
