<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR MP4動画再生（確実再生・常時継続モード）</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 999;
      pointer-events: none;
    }
    #status { font-weight: bold; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }
  </style>

  <!-- A-Frame & MindAR の読み込み -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <!-- 操作ガイドの表示 -->
  <div id="info-overlay">
    <div>状態: <span id="status">準備中...</span></div>
    <div style="margin-top: 4px; font-size: 10px; color: #aaa;">1本指スライド: 位置移動 / 2本指ピンチ: 拡大縮小</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- MP4動画の読み込み (スマホ対応のため playsinline, muted を推奨) -->
      <video id="vid" src="video.mp4" preload="auto" response-type="arraybuffer" loop crossorigin="anonymous" webkit-playsinline playsinline muted></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- マーカーを認識したときに表示されるターゲット -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <!-- 動画を表示する板 (16:9のアスペクト比の例: width=1, height=0.5625) -->
      <a-plane 
        id="videoPlane" 
        src="#vid" 
        position="0 0 0" 
        width="1" 
        height="0.5625" 
        scale="1 1 1">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const sceneEl = document.querySelector('a-scene');
    const videoPlane = document.querySelector('#videoPlane');
    const videoEl = document.querySelector('#vid');
    const targetEntity = document.querySelector('#targetEntity');

    let isVideoStarted = false;

    // カメラ起動・エラーの判定
    sceneEl.addEventListener("arReady", () => {
      statusEl.textContent = "カメラ起動成功！マーカーをかざしてください";
      statusEl.className = "success";
    });

    sceneEl.addEventListener("arError", () => {
      statusEl.textContent = "エラー: targets.mind の読み込み失敗";
      statusEl.className = "error";
    });

    // マーカーを検出したとき（初回のみ処理を実行）
    targetEntity.addEventListener('targetFound', () => {
      if (isVideoStarted) return; // すでに再生開始していれば何もしない

      isVideoStarted = true;
      statusEl.textContent = "動画ロード中...";
      statusEl.className = "";

      // 動画のロードを開始
      videoEl.load();

      // ロード完了（再生可能）を待ってから確実に再生する
      const playVideo = () => {
        videoEl.play().then(() => {
          statusEl.textContent = "再生中（マーカーロスト継続モード）";
          statusEl.className = 'success';

          // ★重要：MindARの追従を解除し、マーカーが見えなくなってもその場に固定して再生し続けるモードにする
          targetEntity.removeAttribute('mindar-image-target');
        }).catch(error => {
          console.log("自動再生がブロックされました:", error);
          statusEl.textContent = "画面をタップして動画を再生してください";
          statusEl.className = "error";
        });
      };

      if (videoEl.readyState >= 3) {
        playVideo();
      } else {
        videoEl.addEventListener('canplaythrough', playVideo, { once: true });
      }
    });

    // 自動再生ブロック対策：ブラウザ制限で止まった場合、画面をタップすれば確実に再生が始まる保険
    window.addEventListener('click', () => {
      if (isVideoStarted && videoEl.paused) {
        videoEl.play().then(() => {
          statusEl.textContent = "再生中（マーカーロスト継続モード）";
          statusEl.className = 'success';
          targetEntity.removeAttribute('mindar-image-target');
        }).catch(e => console.log(e));
      }
    }, { once: true });

    // タッチ操作（1本指スライド移動 ＆ 2本指ピンチ拡大縮小）の処理
    let isDragging = false;
    let previousTouchPosition = { x: 0, y: 0 };
    let initialDistance = null;
    let initialScale = 1;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (videoPlane) {
          const s = videoPlane.getAttribute('scale');
          if (s) initialScale = s.x;
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!videoPlane) return;

      // 1本指でのスライド（位置移動）
      if (e.touches.length === 1 && isDragging) {
        const currentX = e.touches[0].clientX;
        const currentY = e.touches[0].clientY;
        const deltaX = currentX - previousTouchPosition.x;
        const deltaY = currentY - previousTouchPosition.y;
        previousTouchPosition = { x: currentX, y: currentY };

        const pos = videoPlane.getAttribute('position');
        const speed = 0.003; // 移動感度（必要に応じて調整してください）
        pos.x += deltaX * speed;
        pos.y -= deltaY * speed; // 画面の上下と3D空間の上下は逆のためマイナス
        videoPlane.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
      } 
      // 2本指でのピンチイン・ピンチアウト（拡大縮小）
      else if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        let newScale = Math.max(0.2, Math.min(3.0, initialScale * factor));
        videoPlane.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      isDragging = false;
      initialDistance = null;
    });
  </script>
</body>
</html>
