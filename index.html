<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR MP4動画再生</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      touch-action: none;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #info-overlay {
      position: fixed;
      top: 12px;
      left: 12px;
      max-width: 58vw;
      padding: 10px 14px;
      box-sizing: border-box;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 12px;
      z-index: 9999;
      pointer-events: none;
    }

    #status {
      color: #ffd700;
      font-weight: bold;
    }

    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }

    #loading-overlay {
      position: fixed;
      top: 12px;
      right: 12px;
      max-width: 44vw;
      padding: 10px 12px;
      box-sizing: border-box;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffd700;
      font-size: 13px;
      font-weight: bold;
      text-align: right;
      z-index: 10000;
      pointer-events: none;
    }

    #retryButton {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 10001;
      padding: 14px 22px;
      border: 0;
      border-radius: 10px;
      background: #1465cc;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
      touch-action: manipulation;
    }

    /* 動画要素は画面に出さず、a-planeのテクスチャとして使う */
    #vid {
      position: fixed;
      left: -2px;
      top: -2px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <!-- A-FrameとMindARを先に読み込んでからARシーンを作る -->
  <script
    src="https://aframe.io/releases/1.5.0/aframe.min.js"
    onerror="window.__arLibraryError = 'A-Frame';">
  </script>
  <script
    src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"
    onerror="window.__arLibraryError = 'MindAR';">
  </script>
</head>
<body>
  <div id="info-overlay">
    <div>状態：<span id="status">AR起動中...</span></div>
    <div style="margin-top:4px;color:#aaa;font-size:10px;">
      1本指で移動 ／ 2本指で拡大・縮小
    </div>
  </div>

  <div id="loading-overlay">動画読込：マーカー待機中</div>
  <button id="retryButton" type="button">タップして動画を再生</button>

  <!-- videoをa-assetsに入れず、ARシーン起動時の待ち時間を減らす -->
  <video id="vid" preload="none" muted loop playsinline webkit-playsinline></video>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="1000"></a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <a-plane
        id="videoPlane"
        position="0 0 0.01"
        width="1"
        height="0.5625"
        visible="false">
      </a-plane>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.getElementById('scene');
    const statusEl = document.getElementById('status');
    const loadingEl = document.getElementById('loading-overlay');
    const retryButton = document.getElementById('retryButton');
    const targetEntity = document.getElementById('targetEntity');
    const videoPlane = document.getElementById('videoPlane');
    const videoEl = document.getElementById('vid');

    const VIDEO_URL = './video.mp4';

    let arReady = false;
    let markerFound = false;
    let isLoading = false;
    let isVideoReady = false;
    let startupTimer;

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = type;
    }

    function setProgress(percent, message = '') {
      const suffix = message ? `（${message}）` : '';
      loadingEl.textContent = `動画読込：${percent}%${suffix}`;
    }

    // 外部スクリプトが読み込めなかった場合は、準備中のままにしない
    if (
      window.__arLibraryError ||
      !window.AFRAME ||
      !window.AFRAME.components['mindar-image']
    ) {
      setStatus('ARライブラリを読み込めません。通信状態を確認してください', 'error');
    } else {
      setStatus('AR起動中。カメラの許可を確認してください');
    }

    sceneEl.addEventListener('arReady', () => {
      arReady = true;
      clearTimeout(startupTimer);
      setStatus('カメラ起動成功。マーカーをかざしてください', 'success');
      loadingEl.textContent = '動画読込：マーカー待機中';
    });

    sceneEl.addEventListener('arError', (event) => {
      clearTimeout(startupTimer);
      console.error('MindAR起動エラー:', event);
      setStatus('AR起動エラー。HTTPS・カメラ許可・targets.mindを確認してください', 'error');
    });

    // AR起動イベントが来ない場合、確認箇所を画面に表示する
    startupTimer = setTimeout(() => {
      if (!arReady) {
        setStatus('AR起動待ちです。HTTPS・カメラ許可・targets.mindを確認してください', 'error');
      }
    }, 20000);

    function updateLoadProgress() {
      if (!isLoading) return;

      const duration = videoEl.duration;
      if (!Number.isFinite(duration) || duration <= 0 || videoEl.buffered.length === 0) {
        setProgress(0);
        return;
      }

      // 先頭から連続してバッファされた範囲の割合を表示
      let bufferedEnd = 0;
      for (let i = 0; i < videoEl.buffered.length; i++) {
        const start = videoEl.buffered.start(i);
        const end = videoEl.buffered.end(i);

        if (start <= bufferedEnd + 0.25) {
          bufferedEnd = Math.max(bufferedEnd, end);
        }
      }

      const percent = Math.min(99, Math.floor((bufferedEnd / duration) * 100));
      setProgress(percent);
    }

    function waitForCanPlay(media) {
      return new Promise((resolve, reject) => {
        if (media.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
          resolve();
          return;
        }

        let timer;

        function cleanup() {
          clearTimeout(timer);
          media.removeEventListener('canplay', onCanPlay);
          media.removeEventListener('error', onError);
        }

        function onCanPlay() {
          cleanup();
          resolve();
        }

        function onError() {
          const code = media.error ? media.error.code : '不明';
          cleanup();
          reject(new Error(`動画の読み込みに失敗しました（code: ${code}）`));
        }

        media.addEventListener('canplay', onCanPlay);
        media.addEventListener('error', onError);

        timer = setTimeout(() => {
          cleanup();
          reject(new Error('動画の再生準備がタイムアウトしました'));
        }, 90000);
      });
    }

    async function loadVideoAfterMarker() {
      if (isLoading || isVideoReady) return;

      isLoading = true;
      retryButton.style.display = 'none';
      setProgress(0);
      setStatus('マーカーを認識しました。動画を読み込んでいます...');

      try {
        videoEl.pause();
        videoEl.removeAttribute('src');
        videoEl.preload = 'auto';
        videoEl.muted = true;
        videoEl.defaultMuted = true;
        videoEl.loop = true;
        videoEl.playsInline = true;

        const readyPromise = waitForCanPlay(videoEl);
        videoEl.src = VIDEO_URL;
        videoEl.load();

        await readyPromise;

        videoPlane.setAttribute('src', '#vid');
        videoPlane.setAttribute('visible', true);
        isVideoReady = true;
        setProgress(100, '再生準備完了');

        if (markerFound) {
          await playVideo();
        } else {
          setStatus('動画の準備完了。マーカーをもう一度かざしてください');
        }
      } catch (error) {
        console.error('動画ロードエラー:', error);
        isVideoReady = false;
        videoPlane.setAttribute('visible', false);
        setProgress(0, 'エラー');
        setStatus(`動画を読み込めませんでした。${error.message}`, 'error');

        retryButton.textContent = '動画読込を再試行';
        retryButton.style.display = 'block';

        videoEl.pause();
        videoEl.removeAttribute('src');
        videoEl.load();
      } finally {
        isLoading = false;
      }
    }

    async function playVideo() {
      if (!isVideoReady || !markerFound) return;

      videoEl.muted = true;
      videoPlane.setAttribute('visible', true);

      try {
        await videoEl.play();
        retryButton.style.display = 'none';
      } catch (error) {
        console.warn('自動再生が制限されました:', error);
        setStatus('下のボタンをタップして動画を再生してください', 'error');
        retryButton.textContent = 'タップして動画を再生';
        retryButton.style.display = 'block';
      }
    }

    targetEntity.addEventListener('targetFound', () => {
      markerFound = true;

      if (!isVideoReady && !isLoading) {
        loadVideoAfterMarker();
      } else if (isLoading) {
        setStatus('動画を読み込んでいます...');
      } else if (isVideoReady && videoEl.paused) {
        playVideo();
      }
    });

    targetEntity.addEventListener('targetLost', () => {
      markerFound = false;

      if (isLoading) {
        setStatus('マーカーを見失いました。動画の読み込みは継続中です');
      } else {
        videoEl.pause();
        setStatus('マーカーを検索中...');
      }
    });

    videoEl.addEventListener('progress', updateLoadProgress);
    videoEl.addEventListener('loadedmetadata', updateLoadProgress);
    videoEl.addEventListener('durationchange', updateLoadProgress);

    videoEl.addEventListener('playing', () => {
      setProgress(100, '再生中');
      setStatus('動画再生中。スライドで位置を動かせます', 'success');
      retryButton.style.display = 'none';
    });

    retryButton.addEventListener('click', () => {
      if (isVideoReady) {
        playVideo();
      } else {
        loadVideoAfterMarker();
      }
    });

    // マーカー上の動画を1本指で移動し、2本指で拡大縮小する
    let gestureMode = null;
    let startX = 0;
    let startY = 0;
    let startPosition = { x: 0, y: 0 };
    let initialDistance = 0;
    let initialScale = 1;

    window.addEventListener('touchstart', (event) => {
      if (event.target instanceof Element && event.target.closest('#retryButton')) return;
      if (!isVideoReady || !markerFound) return;

      const position = videoPlane.getAttribute('position');
      const scale = videoPlane.getAttribute('scale');

      if (event.touches.length === 1) {
        gestureMode = 'drag';
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
        startPosition = { x: position.x, y: position.y };
        initialScale = scale ? scale.x : 1;
      } else if (event.touches.length === 2) {
        gestureMode = 'pinch';
        initialDistance = Math.hypot(
          event.touches[0].clientX - event.touches[1].clientX,
          event.touches[0].clientY - event.touches[1].clientY
        );
        initialScale = scale ? scale.x : 1;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (event) => {
      if (!isVideoReady || !markerFound) return;

      if (gestureMode === 'drag' && event.touches.length === 1) {
        const dx = (event.touches[0].clientX - startX) * 0.003;
        const dy = (event.touches[0].clientY - startY) * 0.003;
        const x = Math.max(-1.2, Math.min(1.2, startPosition.x + dx));
        const y = Math.max(-0.8, Math.min(0.8, startPosition.y - dy));

        videoPlane.setAttribute('position', `${x} ${y} 0.01`);
      } else if (gestureMode === 'pinch' && event.touches.length === 2 && initialDistance > 0) {
        const distance = Math.hypot(
          event.touches[0].clientX - event.touches[1].clientX,
          event.touches[0].clientY - event.touches[1].clientY
        );
        const scale = Math.max(0.2, Math.min(3, initialScale * (distance / initialDistance)));

        videoPlane.setAttribute('scale', `${scale} ${scale} ${scale}`);
      }
    }, { passive: true });

    window.addEventListener('touchend', (event) => {
      if (event.touches.length < 2) {
        gestureMode = null;
        initialDistance = 0;
      }
    }, { passive: true });
  </script>
</body>
</html>
