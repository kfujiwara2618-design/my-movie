<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MindAR MP4動画</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      touch-action: none;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #info-overlay {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9999;
      max-width: calc(100vw - 24px);
      padding: 10px 14px;
      box-sizing: border-box;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 12px;
      pointer-events: none;
    }

    #status {
      color: #ffd700;
      font-weight: bold;
    }

    .success {
      color: #51cf66 !important;
    }

    .error {
      color: #ff6b6b !important;
    }

    #startButton {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 10001;
      transform: translateX(-50%);
      padding: 14px 22px;
      border: 0;
      border-radius: 10px;
      background: #1465cc;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
      touch-action: manipulation;
    }

    #startButton:disabled {
      opacity: 0.65;
    }
  </style>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <div id="info-overlay">
    <div>状態：<span id="status">準備中...</span></div>
    <div style="margin-top:4px;color:#aaa;font-size:10px;">
      認識後に動画を表示 ／ 1本指で移動・2本指で拡大縮小
    </div>
  </div>

  <button id="startButton" type="button" disabled>
    カメラと動画を開始
  </button>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      filterMinCF: 0.0005;
      filterBeta: 1000;
      warmupTolerance: 5;
      missTolerance: 10;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="3000">
      <video
        id="vid"
        src="./video.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera
      id="camera"
      position="0 0 0"
      camera="fov: 70"
      look-controls="enabled: false">

      <a-video
        id="videoPlane"
        src="#vid"
        position="0 0 -1.8"
        width="1"
        height="0.5625"
        scale="1 1 1"
        visible="false">
      </a-video>
    </a-camera>

    <a-entity
      id="targetEntity"
      mindar-image-target="targetIndex: 0">
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const statusEl = document.getElementById('status');
    const startButton = document.getElementById('startButton');
    const targetEntity = document.getElementById('targetEntity');
    const videoEl = document.getElementById('vid');
    const videoPlane = document.getElementById('videoPlane');

    const CAMERA_FOV_DEGREES = 70;
    const VIDEO_WIDTH = 1;
    const VIDEO_HEIGHT = 0.5625;

    let sceneLoaded = sceneEl.hasLoaded;
    let arReady = false;
    let arStartRequested = false;
    let hasStarted = false;
    let markerFoundOnce = false;

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = type;
    }

    function showStartButton(label) {
      startButton.textContent = label;
      startButton.disabled = false;
      startButton.style.display = 'block';
    }

    function hideStartButton() {
      startButton.style.display = 'none';
    }

    function showVideoPlane() {
      videoPlane.setAttribute('visible', true);
    }

    function hideVideoPlane() {
      videoPlane.setAttribute('visible', false);
    }

    function getMediaErrorMessage() {
      if (!videoEl.error) return '動画を読み込めませんでした';

      const messages = {
        1: '動画の読み込みが中断されました',
        2: '動画を取得できません。ファイル名や配置を確認してください',
        3: '動画をデコードできません。MP4の形式を確認してください',
        4: 'このブラウザで再生できない動画形式です'
      };

      return messages[videoEl.error.code] || '動画の読み込みに失敗しました';
    }

    sceneEl.addEventListener('loaded', () => {
      sceneLoaded = true;
      startButton.disabled = false;
      setStatus('開始ボタンを押してください');
    });

    if (sceneLoaded) {
      startButton.disabled = false;
      setStatus('開始ボタンを押してください');
    }

    sceneEl.addEventListener('arReady', () => {
      arReady = true;

      if (markerFoundOnce && !videoEl.paused) {
        setStatus('動画再生中。画面をスライドして移動できます', 'success');
      } else {
        setStatus('カメラ起動成功。マーカーをかざしてください', 'success');
      }
    });

    sceneEl.addEventListener('arError', (event) => {
      console.error('MindAR起動エラー:', event);
      arStartRequested = false;
      setStatus('カメラを起動できません。権限とHTTPS接続を確認してください', 'error');
      showStartButton('カメラと動画を再試行');
    });

    /*
      重要：
      video.play()をボタンのクリック処理の中で直接呼び出します。
      ブラウザの自動再生制限に対応するため、音声はミュートで開始します。
    */
    startButton.addEventListener('click', () => {
      if (!sceneLoaded) {
        setStatus('ARを準備中です。少し待ってから押してください');
        return;
      }

      hasStarted = true;
      startButton.disabled = true;
      startButton.textContent = '起動中...';

      videoEl.muted = true;
      videoEl.loop = true;
      videoEl.playsInline = true;

      let playPromise;
      try {
        // ユーザーのタップ中に呼び出すことが、スマートフォンでの再生に重要です。
        playPromise = videoEl.play();
      } catch (error) {
        playPromise = Promise.reject(error);
      }

      Promise.resolve(playPromise).catch((error) => {
        console.warn('動画を再生できません:', error);
        setStatus('動画を開始できません。下のボタンでもう一度お試しください', 'error');
        showStartButton('動画を再試行');
      });

      if (!arReady && !arStartRequested) {
        const arSystem = sceneEl.systems['mindar-image-system'];

        if (!arSystem) {
          setStatus('ARを読み込めません。通信状態を確認してください', 'error');
          showStartButton('カメラと動画を再試行');
          return;
        }

        arStartRequested = true;

        try {
          Promise.resolve(arSystem.start()).catch((error) => {
            console.error('カメラ開始エラー:', error);
            arStartRequested = false;
            setStatus('カメラを起動できません。権限とHTTPS接続を確認してください', 'error');
            showStartButton('カメラと動画を再試行');
          });
        } catch (error) {
          console.error('カメラ開始エラー:', error);
          arStartRequested = false;
          setStatus('カメラを起動できません。権限とHTTPS接続を確認してください', 'error');
          showStartButton('カメラと動画を再試行');
        }
      }
    });

    targetEntity.addEventListener('targetFound', () => {
      if (!markerFoundOnce) {
        markerFoundOnce = true;

        // マーカーを初めて認識した時点から動画を見せます。
        // 認識前に再生準備ができていれば、動画を先頭に戻します。
        if (videoEl.readyState >= HTMLMediaElement.HAVE_METADATA) {
          try {
            videoEl.currentTime = 0;
          } catch (_) {
            // 再生準備中はブラウザによってシークできないことがあります。
          }
        }
      }

      if (!videoEl.paused && videoEl.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
        showVideoPlane();
        setStatus('動画再生中。画面をスライドして移動できます', 'success');
      } else {
        setStatus('マーカーを認識しました。動画の準備中です...');
      }
    });

    targetEntity.addEventListener('targetLost', () => {
      // 見失っても動画を止めたり隠したりしません。
      if (markerFoundOnce && !videoEl.paused) {
        setStatus('動画再生中。動画は画面内に表示されています', 'success');
      } else if (!markerFoundOnce) {
        setStatus('マーカーを検索中...');
      }
    });

    videoEl.addEventListener('playing', () => {
      hideStartButton();

      if (markerFoundOnce) {
        showVideoPlane();
        setStatus('動画再生中。画面をスライドして移動できます', 'success');
      } else {
        hideVideoPlane();
        setStatus('動画の再生準備完了。マーカーをかざしてください', 'success');
      }
    });

    videoEl.addEventListener('waiting', () => {
      if (markerFoundOnce) {
        setStatus('動画を読み込み中です...');
      }
    });

    videoEl.addEventListener('error', () => {
      console.error(getMediaErrorMessage(), videoEl.error);
      setStatus(getMediaErrorMessage(), 'error');
      showStartButton('動画を再試行');
    });

    videoEl.addEventListener('pause', () => {
      if (
        hasStarted &&
        !videoEl.ended &&
        document.visibilityState === 'visible'
      ) {
        setStatus('動画が停止しています。タップして再開してください', 'error');
        showStartButton('動画を再開');
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (
        document.visibilityState === 'visible' &&
        hasStarted &&
        videoEl.paused &&
        !videoEl.ended
      ) {
        setStatus('動画が停止しています。タップして再開してください', 'error');
        showStartButton('動画を再開');
      }
    });

    // ----- 画面上での移動・拡大縮小 -----

    const activePointers = new Map();
    let gesture = null;

    function distanceBetween(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function getViewBounds(z) {
      const halfHeight = Math.abs(z) *
        Math.tan((CAMERA_FOV_DEGREES * Math.PI / 180) / 2);
      const halfWidth = halfHeight * (window.innerWidth / window.innerHeight);

      return { halfWidth, halfHeight };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function clampVideoPosition(scale) {
      const position = videoPlane.getAttribute('position');
      const { halfWidth, halfHeight } = getViewBounds(position.z);

      const xLimit = Math.max(0, halfWidth - (VIDEO_WIDTH * scale / 2));
      const yLimit = Math.max(0, halfHeight - (VIDEO_HEIGHT * scale / 2));

      videoPlane.setAttribute('position', {
        x: clamp(position.x, -xLimit, xLimit),
        y: clamp(position.y, -yLimit, yLimit),
        z: position.z
      });
    }

    function getMaxScale(z) {
      const { halfWidth, halfHeight } = getViewBounds(z);
      const fitWidth = (2 * halfWidth) / VIDEO_WIDTH;
      const fitHeight = (2 * halfHeight) / VIDEO_HEIGHT;
      return Math.max(0.3, Math.min(2.5, fitWidth, fitHeight));
    }

    function beginDrag(pointerId) {
      const point = activePointers.get(pointerId);
      const position = videoPlane.getAttribute('position');

      gesture = {
        type: 'drag',
        pointerId,
        startX: point.x,
        startY: point.y,
        startPosition: {
          x: position.x,
          y: position.y,
          z: position.z
        }
      };
    }

    function beginPinch() {
      const ids = Array.from(activePointers.keys()).slice(0, 2);
      if (ids.length < 2) return;

      const a = activePointers.get(ids[0]);
      const b = activePointers.get(ids[1]);
      const scale = videoPlane.getAttribute('scale');

      gesture = {
        type: 'pinch',
        ids,
        startDistance: Math.max(1, distanceBetween(a, b)),
        startScale: scale.x
      };
    }

    window.addEventListener('pointerdown', (event) => {
      if (event.target instanceof Element && event.target.closest('#startButton')) {
        return;
      }

      if (!videoPlane.object3D.visible) return;

      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (event.target && event.target.setPointerCapture) {
        try {
          event.target.setPointerCapture(event.pointerId);
        } catch (_) {}
      }

      if (activePointers.size === 1) {
        beginDrag(event.pointerId);
      } else {
        beginPinch();
      }
    }, { passive: true });

    window.addEventListener('pointermove', (event) => {
      if (!activePointers.has(event.pointerId)) return;

      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (gesture && gesture.type === 'drag' && activePointers.size === 1) {
        const position = gesture.startPosition;
        const { halfHeight } = getViewBounds(position.z);
        const worldUnitsPerPixel = (2 * halfHeight) / window.innerHeight;

        const scale = videoPlane.getAttribute('scale').x;
        const x = position.x +
          (event.clientX - gesture.startX) * worldUnitsPerPixel;
        const y = position.y -
          (event.clientY - gesture.startY) * worldUnitsPerPixel;

        videoPlane.setAttribute('position', { x, y, z: position.z });
        clampVideoPosition(scale);
      } else if (gesture && gesture.type === 'pinch') {
        const a = activePointers.get(gesture.ids[0]);
        const b = activePointers.get(gesture.ids[1]);
        if (!a || !b) return;

        const position = videoPlane.getAttribute('position');
        const maxScale = getMaxScale(position.z);
        const nextScale = clamp(
          gesture.startScale *
            (distanceBetween(a, b) / gesture.startDistance),
          0.3,
          maxScale
        );

        videoPlane.setAttribute('scale', {
          x: nextScale,
          y: nextScale,
          z: nextScale
        });
        clampVideoPosition(nextScale);
      }

      event.preventDefault();
    }, { passive: false });

    function endPointer(event) {
      activePointers.delete(event.pointerId);

      if (activePointers.size === 1) {
        beginDrag(Array.from(activePointers.keys())[0]);
      } else if (activePointers.size >= 2) {
        beginPinch();
      } else {
        gesture = null;
      }
    }

    window.addEventListener('pointerup', endPointer, { passive: true });
    window.addEventListener('pointercancel', endPointer, { passive: true });

    window.addEventListener('resize', () => {
      const scale = videoPlane.getAttribute('scale').x;
      clampVideoPosition(scale);
    });
  </script>
</body>
</html>
