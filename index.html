<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR MP4動画再生（確実起動・常時表示）</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    /* スマホの自動再生ブロックを回避するためのスタート画面 */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: #fff;
    }
    #start-btn {
      background: #51cf66;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(81, 207, 102, 0.4);
      cursor: pointer;
    }
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 999;
      pointer-events: none;
      display: none; /* スタートボタンを押した後に表示 */
    }
    #status { font-weight: bold; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }
  </style>

  <!-- A-Frame & MindAR の読み込み -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <!-- スマホの自動再生ブロックを確実に突破するためのオーバーレイ -->
  <div id="start-overlay">
    <div style="margin-bottom: 20px; text-align: center; padding: 0 20px;">
      <h2>AR動画プレイヤー</h2>
      <p style="font-size: 14px; color: #ccc;">下のボタンを押してカメラと動画を起動してください</p>
    </div>
    <button id="start-btn">タップしてARを開始</button>
  </div>

  <!-- 操作ガイドの表示 -->
  <div id="info-overlay">
    <div>状態: <span id="status">準備中...</span></div>
    <div style="margin-top: 4px; font-size: 10px; color: #aaa;">2本指ピンチ: 動画の拡大縮小</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- MP4動画の読み込み設定 -->
      <video id="vid" src="video.mp4" preload="auto" response-type="arraybuffer" loop crossorigin="anonymous" webkit-playsinline playsinline muted></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- マーカーを認識したときの基準エンティティ -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <a-plane 
        id="videoPlane" 
        src="#vid" 
        position="0 0 0" 
        width="1" 
        height="0.5625" 
        scale="1 1 1">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const infoOverlay = document.getElementById('info-overlay');
    const statusEl = document.getElementById('status');
    const sceneEl = document.querySelector('a-scene');
    const videoPlane = document.querySelector('#videoPlane');
    const videoEl = document.querySelector('#vid');
    const targetEntity = document.querySelector('#targetEntity');

    let isLocked = false;

    // ユーザーが「タップしてARを開始」を押した瞬間、ブラウザの自動再生制限を解除する
    startBtn.addEventListener('click', () => {
      startOverlay.style.display = 'none';
      infoOverlay.style.display = 'block';

      // 動画のロードと一時再生によるアンロック
      videoEl.play().then(() => {
        videoEl.pause();
        videoEl.currentTime = 0;
      }).catch(e => {
        console.log("初期化再生ブロック:", e);
      });
    });

    // カメラ起動・エラーの判定
    sceneEl.addEventListener("arReady", () => {
      statusEl.textContent = "カメラ起動成功！マーカーをかざしてください";
      statusEl.className = "success";
    });

    sceneEl.addEventListener("arError", () => {
      statusEl.textContent = "エラー: targets.mind の読み込み失敗";
      statusEl.className = "error";
    });

    // マーカーを検出したとき
    targetEntity.addEventListener('targetFound', () => {
      statusEl.textContent = "認識成功！動画再生中（マーカーを外しても継続します）";
      statusEl.className = 'success';

      // 動画を再生
      videoEl.play().catch(error => {
        console.log("動画再生エラー:", error);
      });

      // 初回認識時に、マーカーの追従から切り離して空間に固定する（ロスト対策）
      if (!isLocked) {
        isLocked = true;
        setTimeout(() => {
          const worldPos = new THREE.Vector3();
          const worldRot = new THREE.Quaternion();
          const worldScale = new THREE.Vector3();

          videoPlane.object3D.getWorldPosition(worldPos);
          videoPlane.object3D.getWorldQuaternion(worldRot);
          videoPlane.object3D.getWorldScale(worldScale);

          // シーンの直下に移動させることで、マーカーを見失っても消えなくなる
          sceneEl.appendChild(videoPlane);

          videoPlane.object3D.position.copy(worldPos);
          videoPlane.object3D.quaternion.copy(worldRot);
          videoPlane.object3D.scale.copy(worldScale);
        }, 50);
      }
    });

    // ピンチイン・ピンチアウト（拡大縮小）の処理
    let initialDistance = null;
    let initialScale = 1;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (videoPlane) {
          const s = videoPlane.getAttribute('scale');
          if (s) initialScale = s.x;
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!videoPlane) return;

      if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        let newScale = Math.max(0.2, Math.min(3.0, initialScale * factor));
        videoPlane.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      initialDistance = null;
    });
  </script>
</body>
</html>
