<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR MP4動画再生（持続再生・ロード進捗付き）</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 999;
      pointer-events: none;
    }
    #status { font-weight: bold; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }
  </style>

  <!-- A-Frame & MindAR の読み込み -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <!-- 操作ガイドの表示 -->
  <div id="info-overlay">
    <div>状態: <span id="status">準備中...</span></div>
    <div style="margin-top: 4px; font-size: 10px; color: #aaa;">1本指スライド: 位置移動 / 2本指ピンチ: 拡大縮小</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- 初回はロードを抑え、マーカー検出後にロードを開始します -->
      <video id="vid" src="video.mp4" preload="none" loop crossorigin="anonymous" webkit-playsinline playsinline muted></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- マーカーを認識したときに表示されるターゲット -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <!-- 動画を表示する板 (16:9のアスペクト比の例: width=1, height=0.5625) -->
      <a-plane 
        id="videoPlane" 
        src="#vid" 
        position="0 0 0" 
        width="1" 
        height="0.5625" 
        scale="1 1 1">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const sceneEl = document.querySelector('a-scene');
    const videoPlane = document.querySelector('#videoPlane');
    const videoEl = document.querySelector('#vid');
    const targetEntity = document.querySelector('#targetEntity');

    let isVideoLoading = false;
    let isVideoLoaded = false;
    let isPlayingPersistent = false; // 一度再生が始まったらマーカーロストしても続けるモード

    // カメラ起動・エラーの判定
    sceneEl.addEventListener("arReady", () => {
      statusEl.textContent = "カメラ起動成功！マーカーをかざしてください";
      statusEl.className = "success";
    });

    sceneEl.addEventListener("arError", () => {
      statusEl.textContent = "エラー: targets.mind の読み込み失敗";
      statusEl.className = "error";
    });

    // マーカーを検出したとき
    targetEntity.addEventListener('targetFound', () => {
      if (!isPlayingPersistent) {
        if (!isVideoLoading && !isVideoLoaded) {
          startLoadingVideo();
        } else if (isVideoLoaded) {
          statusEl.textContent = "認識成功！動画再生中";
          statusEl.className = 'success';
          videoEl.play().catch(e => console.log(e));
          isPlayingPersistent = true;
        }
      } else {
        statusEl.textContent = "動画再生中（持続モード）";
        statusEl.className = 'success';
      }
    });

    // マーカーを見失ったとき（持続モードであれば再生・表示を維持）
    targetEntity.addEventListener('targetLost', () => {
      if (isPlayingPersistent) {
        statusEl.textContent = '動画再生中（マーカー非表示）';
        statusEl.className = 'success';
      } else {
        statusEl.textContent = 'マーカーを検索中...';
        statusEl.className = '';
      }
    });

    // 動画のロード処理とパーセント表示
    function startLoadingVideo() {
      isVideoLoading = true;
      statusEl.textContent = "動画ロード開始...";
      videoEl.load();

      // progressイベントで読み込み進捗を計算してパーセント表示
      videoEl.addEventListener('progress', () => {
        if (!isVideoLoaded && videoEl.buffered.length > 0) {
          try {
            const bufferedEnd = videoEl.buffered.end(videoEl.buffered.length - 1);
            const duration = videoEl.duration;
            if (duration > 0) {
              const percent = Math.min(100, Math.round((bufferedEnd / duration) * 100));
              statusEl.textContent = `動画ロード中... ${percent}%`;
            }
          } catch (e) {
            // エラーハンドリング
          }
        }
      });

      // ロード完了（再生準備完了）次第、再生開始
      videoEl.addEventListener('canplaythrough', () => {
        if (!isVideoLoaded) {
          isVideoLoaded = true;
          isVideoLoading = false;
          statusEl.textContent = "ロード完了！動画再生中";
          statusEl.className = "success";
          videoEl.play().then(() => {
            isPlayingPersistent = true; // 再生開始以降はロストしても消えないモードへ
          }).catch(error => {
            console.log("自動再生ブロック:", error);
            statusEl.textContent = "画面をタップして再生してください";
          });
        }
      }, { once: true });
    }

    // スマホのブラウザ制限で自動再生がブロックされた場合の保険（画面タップで再生）
    window.addEventListener('click', () => {
      if (isVideoLoaded && videoEl.paused) {
        videoEl.play();
        isPlayingPersistent = true;
        statusEl.textContent = "動画再生中";
        statusEl.className = 'success';
      }
    });

    // タッチ操作（1本指スライドでの位置移動 ＆ 2本指ピンチでの拡大縮小）
    let initialDistance = null;
    let initialScale = 1;
    let touchStartX = 0;
    let touchStartY = 0;
    let initialPosition = { x: 0, y: 0, z: 0 };
    let isDragging = false;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        if (videoPlane) {
          initialPosition = videoPlane.getAttribute('position');
        }
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (videoPlane) {
          const s = videoPlane.getAttribute('scale');
          if (s) initialScale = s.x;
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!videoPlane) return;

      // 1本指スライド（位置移動）
      if (e.touches.length === 1 && isDragging) {
        const deltaX = (e.touches[0].clientX - touchStartX) * 0.003;
        const deltaY = (e.touches[0].clientY - touchStartY) * 0.003;
        const newX = initialPosition.x + deltaX;
        const newY = initialPosition.y - deltaY;
        videoPlane.setAttribute('position', `${newX} ${newY} ${initialPosition.z}`);
      }

      // 2本指ピンチ（拡大縮小）
      if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        let newScale = Math.max(0.2, Math.min(3.0, initialScale * factor));
        videoPlane.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isDragging = false;
      }
      initialDistance = null;
    });
  </script>
</body>
</html>
