<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR マーカーレス動画常時表示</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 999;
      pointer-events: none;
    }
    #status { font-weight: bold; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }
  </style>

  <!-- A-Frame & MindAR の読み込み -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <!-- 操作ガイドの表示 -->
  <div id="info-overlay">
    <div>状態: <span id="status">準備中...</span></div>
    <div style="margin-top: 4px; font-size: 10px; color: #aaa;">2本指ピンチ: 動画の拡大縮小</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- MP4動画の読み込み -->
      <video id="vid" src="video.mp4" preload="auto" response-type="arraybuffer" loop crossorigin="anonymous" webkit-playsinline playsinline muted></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- マーカーを不要にし、カメラの正面（空間の固定位置）に常時表示するエンティティ -->
    <a-entity position="0 0 -1.5">
      <!-- 動画を表示する板 (16:9のアスペクト比: width=1, height=0.5625) -->
      <a-plane 
        id="videoPlane" 
        src="#vid" 
        position="0 0 0" 
        width="1" 
        height="0.5625" 
        scale="1 1 1">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const sceneEl = document.querySelector('a-scene');
    const videoPlane = document.querySelector('#videoPlane');
    const videoEl = document.querySelector('#vid');

    // カメラ起動成功時に自動で動画を再生し、常時表示状態にする
    sceneEl.addEventListener("arReady", () => {
      statusEl.textContent = "カメラ起動完了！動画再生中（マーカー不要）";
      statusEl.className = "success";
      
      videoEl.play().catch(error => {
        console.log("自動再生がブロックされました:", error);
        statusEl.textContent = "画面をタップして再生してください";
      });
    });

    // エラー処理
    sceneEl.addEventListener("arError", () => {
      statusEl.textContent = "エラー: カメラまたはシステムの初期化に失敗しました";
      statusEl.className = "error";
    });

    // 自動再生ブロック対策：画面がタップされたら再生を試みる
    window.addEventListener('click', () => {
      if (videoEl.paused) {
        videoEl.play();
      }
    });

    // ピンチイン・ピンチアウト（拡大縮小）の処理
    let initialDistance = null;
    let initialScale = 1;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (videoPlane) {
          const s = videoPlane.getAttribute('scale');
          if (s) initialScale = s.x;
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!videoPlane) return;

      if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        let newScale = Math.max(0.2, Math.min(3.0, initialScale * factor));
        videoPlane.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      initialDistance = null;
    });
  </script>
</body>
</html>
