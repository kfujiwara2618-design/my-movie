<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR MP4動画再生</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 999;
      pointer-events: none;
    }
    #status { font-weight: bold; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }
  </style>

  <!-- A-Frame & MindAR の読み込み -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <!-- 操作ガイドの表示 -->
  <div id="info-overlay">
    <div>状態: <span id="status">カメラ起動待機中...</span></div>
    <div style="margin-top: 4px; font-size: 10px; color: #aaa;">1本指スライド: 位置移動 / 2本指ピンチ: 拡大縮小</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- 動画要素（srcはJSで動的に読み込み確実性を高めます） -->
      <video id="vid" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline muted></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- マーカーを認識したときに表示されるターゲット -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <!-- 動画を表示する板 (16:9のアスペクト比の例: width=1, height=0.5625) -->
      <a-plane 
        id="videoPlane" 
        src="#vid" 
        position="0 0 0" 
        width="1" 
        height="0.5625" 
        scale="1 1 1">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const sceneEl = document.querySelector('a-scene');
    const videoPlane = document.querySelector('#videoPlane');
    const videoEl = document.querySelector('#vid');
    const targetEntity = document.querySelector('#targetEntity');

    let videoLoaded = false;

    // カメラ起動後にFetch APIで動画をロードし、パーセントを表示する関数
    function loadVideoWithProgress() {
      statusEl.textContent = "動画ロード中... 0%";
      
      fetch('video.mp4')
        .then(response => {
          if (!response.ok) throw new Error('動画ファイルの取得に失敗しました');
          const total = parseInt(response.headers.get('content-length'), 10);
          let loaded = 0;

          const reader = response.body.getReader();
          return new ReadableStream({
            start(controller) {
              function push() {
                reader.read().then(({ done, value }) => {
                  if (done) {
                    controller.close();
                    return;
                  }
                  loaded += value.byteLength;
                  if (total) {
                    const percent = Math.round((loaded / total) * 100);
                    statusEl.textContent = `動画ロード中... ${percent}%`;
                  } else {
                    statusEl.textContent = `動画ロード中... (${Math.round(loaded / 1024)}KB)`;
                  }
                  controller.enqueue(value);
                  push();
                }).catch(err => {
                  controller.error(err);
                });
              }
              push();
            }
          });
        })
        .then(stream => new Response(stream))
        .then(response => response.blob())
        .then(blob => {
          const videoUrl = URL.createObjectURL(blob);
          videoEl.src = videoUrl;
          videoEl.load();
          videoLoaded = true;
          statusEl.textContent = "ロード完了！マーカーをかざしてください";
          statusEl.className = "success";
        })
        .catch(error => {
          console.error(error);
          statusEl.textContent = "エラー: video.mp4 の読み込み失敗";
          statusEl.className = "error";
        });
    }

    // カメラ起動成功の判定
    sceneEl.addEventListener("arReady", () => {
      statusEl.textContent = "カメラ起動成功！動画のロードを開始します...";
      statusEl.className = "success";
      // カメラ起動後に動画のロードを開始
      loadVideoWithProgress();
    });

    sceneEl.addEventListener("arError", () => {
      statusEl.textContent = "エラー: カメラの起動または targets.mind の読み込み失敗";
      statusEl.className = "error";
    });

    // マーカーを検出したとき
    targetEntity.addEventListener('targetFound', () => {
      if (!videoLoaded) return;
      statusEl.textContent = "認識成功！動画再生中";
      statusEl.className = 'success';
      videoEl.play().catch(error => {
        console.log("自動再生が制限されました。画面をタップしてください:", error);
      });
    });

    // マーカーを見失ったとき
    targetEntity.addEventListener('targetLost', () => {
      statusEl.textContent = 'マーカーを検索中...';
      statusEl.className = '';
      videoEl.pause();
    });

    // 保険：スマホの自動再生ブロック対策として、画面タップでも再生を試みる
    window.addEventListener('click', () => {
      if (videoEl.paused && videoLoaded) {
        videoEl.play().catch(e => console.log(e));
      }
    });

    // タッチ操作（1本指でのスライド移動 ＆ 2本指での拡大縮小）
    let isDragging = false;
    let previousTouchPosition = { x: 0, y: 0 };
    let initialDistance = null;
    let initialScale = 1;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (videoPlane) {
          const s = videoPlane.getAttribute('scale');
          if (s) initialScale = s.x;
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!videoPlane) return;

      // 1本指でのスライド（位置移動）
      if (e.touches.length === 1 && isDragging) {
        const deltaX = e.touches[0].clientX - previousTouchPosition.x;
        const deltaY = e.touches[0].clientY - previousTouchPosition.y;
        
        const pos = videoPlane.getAttribute('position');
        const speed = 0.003; // 移動の感度
        pos.x += deltaX * speed;
        pos.y -= deltaY * speed;
        videoPlane.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);

        previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }

      // 2本指でのピンチイン・ピンチアウト（拡大縮小）
      if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        let newScale = Math.max(0.2, Math.min(3.0, initialScale * factor));
        videoPlane.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      isDragging = false;
      initialDistance = null;
    });
  </script>
</body>
</html>
