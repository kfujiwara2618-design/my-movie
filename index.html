<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR MP4動画 確実再生・常時表示</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 999;
      pointer-events: none;
    }
    #status { font-weight: bold; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }
  </style>

  <!-- A-Frame & MindAR の読み込み -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <!-- 操作ガイドの表示 -->
  <div id="info-overlay">
    <div>状態: <span id="status">画面をタップして準備してください</span></div>
    <div style="margin-top: 4px; font-size: 10px; color: #aaa;">2本指ピンチ: 動画の拡大縮小</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- MP4動画の読み込み (スマホ対応のため playsinline, muted を指定) -->
      <video id="vid" src="video.mp4" preload="auto" response-type="arraybuffer" loop crossorigin="anonymous" webkit-playsinline playsinline muted></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- マーカーを認識したときに表示されるターゲット -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <!-- 動画を表示する板 (16:9のアスペクト比) -->
      <a-plane 
        id="videoPlane" 
        src="#vid" 
        position="0 0 0" 
        width="1" 
        height="0.5625" 
        scale="1 1 1">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const sceneEl = document.querySelector('a-scene');
    const videoPlane = document.querySelector('#videoPlane');
    const videoEl = document.querySelector('#vid');
    const targetEntity = document.querySelector('#targetEntity');

    let isAttached = false;     // 空間固定を一度だけ実行するためのフラグ
    let isVideoUnlocked = false; // スマホの自動再生制限解除フラグ

    // カメラ起動時の処理
    sceneEl.addEventListener("arReady", () => {
      statusEl.textContent = "カメラ起動！画面をタップしてマーカーをかざしてください";
      statusEl.className = "success";
    });

    sceneEl.addEventListener("arError", () => {
      statusEl.textContent = "エラー: targets.mind の読み込み失敗";
      statusEl.className = "error";
    });

    // 【重要】スマホの自動再生制限を解除するため、最初の画面タッチで動画をアンロックする
    window.addEventListener('touchstart', () => {
      if (!isVideoUnlocked) {
        videoEl.play().then(() => {
          videoEl.pause(); // すぐ一時停止して準備完了状態にする
          isVideoUnlocked = true;
          console.log("動画の自動再生制限が解除されました");
        }).catch(err => {
          console.log("アンロック時のエラー:", err);
        });
      }
    }, { once: true });

    // マーカーを検出したとき
    targetEntity.addEventListener('targetFound', () => {
      statusEl.textContent = "認識成功！動画再生中（マーカーを外しても継続します）";
      statusEl.className = 'success';

      // 初回認識時に、動画の板をマーカーの管理から外し、現在のワールド座標を維持したまま空間に固定する
      if (!isAttached && videoPlane.object3D) {
        isAttached = true;

        // 現在のワールド座標・回転・スケールを取得
        const worldPos = new THREE.Vector3();
        const worldQuat = new THREE.Quaternion();
        const worldScale = new THREE.Vector3();

        videoPlane.object3D.getWorldPosition(worldPos);
        videoPlane.object3D.getWorldQuaternion(worldQuat);
        videoPlane.object3D.getWorldScale(worldScale);

        // シーン直下に移動させる
        sceneEl.object3D.add(videoPlane.object3D);

        // 取得したワールド座標を再適用して位置のズレや消失を防ぐ
        videoPlane.object3D.position.copy(worldPos);
        videoPlane.object3D.quaternion.copy(worldQuat);
        videoPlane.object3D.scale.copy(worldScale);
      }

      // 確実に動画を再生する
      videoEl.play().catch(error => {
        console.log("再生に失敗しました:", error);
      });
    });

    // マーカーを見失ったとき（動画は止めない・消さない・その場に維持）
    targetEntity.addEventListener('targetLost', () => {
      if (!isAttached) {
        statusEl.textContent = 'マーカーを検索中...';
        statusEl.className = '';
      }
      // マーカーを外しても動画の停止・非表示は一切行いません
    });

    // 2本指でのピンチイン・ピンチアウト（拡大縮小）の処理
    let initialDistance = null;
    let initialScale = 1;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (videoPlane) {
          const s = videoPlane.getAttribute('scale');
          if (s) initialScale = s.x;
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!videoPlane) return;

      if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        let newScale = Math.max(0.2, Math.min(3.0, initialScale * factor));
        videoPlane.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      initialDistance = null;
    });
  </script>
</body>
</html>
