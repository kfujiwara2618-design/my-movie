<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR 動画再生</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      touch-action: none;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #info-overlay {
      position: fixed;
      top: 12px;
      left: 12px;
      max-width: 58vw;
      padding: 10px 14px;
      box-sizing: border-box;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 12px;
      z-index: 9999;
      pointer-events: none;
    }

    #status {
      color: #ffd700;
      font-weight: bold;
    }

    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }

    #loading-overlay {
      position: fixed;
      top: 12px;
      right: 12px;
      max-width: 44vw;
      padding: 10px 12px;
      box-sizing: border-box;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffd700;
      font-size: 13px;
      font-weight: bold;
      text-align: right;
      z-index: 10000;
      pointer-events: none;
    }

    #retryButton {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 10001;
      padding: 14px 22px;
      border: 0;
      border-radius: 10px;
      background: #1465cc;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
      touch-action: manipulation;
    }
  </style>

  <script defer src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <div id="info-overlay">
    <div>状態：<span id="status">準備中...</span></div>
    <div style="margin-top:4px;color:#aaa;font-size:10px;">
      1本指で移動 ／ 2本指で拡大・縮小
    </div>
  </div>

  <div id="loading-overlay" aria-live="polite">動画読込：マーカー待機中</div>
  <button id="retryButton" type="button">タップして動画を再生</button>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- マーカーを認識するまでsrcを設定しない -->
      <video
        id="vid"
        preload="none"
        muted
        loop
        playsinline
        webkit-playsinline>
      </video>
    </a-assets>

    <!-- 動画をカメラの子に置き、マーカーを見失っても画面に表示する -->
    <a-camera id="camera" position="0 0 0" look-controls="enabled: false">
      <a-video
        id="videoPlane"
        position="0 0 -2.2"
        width="1.6"
        height="0.9"
        visible="false">
      </a-video>
    </a-camera>

    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    const sceneEl = document.getElementById('scene');
    const statusEl = document.getElementById('status');
    const loadingEl = document.getElementById('loading-overlay');
    const retryButton = document.getElementById('retryButton');
    const targetEntity = document.getElementById('targetEntity');
    const videoEl = document.getElementById('vid');
    const videoPlane = document.getElementById('videoPlane');
    const cameraEl = document.getElementById('camera');

    const VIDEO_URL = './video.mp4';

    let isLoading = false;
    let isVideoReady = false;
    let videoObjectUrl = null;

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = type;
    }

    function setProgress(percent, message = '') {
      const suffix = message ? `（${message}）` : '';
      loadingEl.textContent = `動画読込：${percent}%${suffix}`;
    }

    sceneEl.addEventListener('arReady', () => {
      setStatus('カメラ起動成功。マーカーをかざしてください');
    });

    sceneEl.addEventListener('arError', (event) => {
      console.error('MindAR起動エラー:', event);
      setStatus('AR起動エラー。カメラ権限とtargets.mindを確認してください', 'error');
    });

    // XHRのBlob受信を使い、全データを配列にコピーせずに進捗を表示する。
    function downloadVideoBlob() {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', VIDEO_URL, true);
        xhr.responseType = 'blob';
        xhr.timeout = 180000;

        xhr.onprogress = (event) => {
          if (event.lengthComputable && event.total > 0) {
            const percent = Math.min(99, Math.floor((event.loaded / event.total) * 100));
            setProgress(percent);
          } else {
            const receivedMB = (event.loaded / 1024 / 1024).toFixed(1);
            setProgress(0, `${receivedMB} MB受信中`);
          }
        };

        xhr.onload = () => {
          if (xhr.status < 200 || xhr.status >= 300) {
            reject(new Error(`video.mp4の取得に失敗しました（HTTP ${xhr.status}）`));
            return;
          }

          if (!xhr.response || xhr.response.size === 0) {
            reject(new Error('video.mp4が空です'));
            return;
          }

          // 配信サーバーのMIME設定に左右されないようMP4形式を指定する
          const blob = new Blob([xhr.response], { type: 'video/mp4' });
          resolve(blob);
        };

        xhr.onerror = () => reject(new Error('動画の通信に失敗しました'));
        xhr.ontimeout = () => reject(new Error('動画のダウンロードがタイムアウトしました'));
        xhr.onabort = () => reject(new Error('動画のダウンロードが中断されました'));

        xhr.send();
      });
    }

    function waitForCanPlay(media) {
      return new Promise((resolve, reject) => {
        if (media.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
          resolve();
          return;
        }

        let timer;

        function cleanup() {
          clearTimeout(timer);
          media.removeEventListener('canplay', onCanPlay);
          media.removeEventListener('error', onError);
        }

        function onCanPlay() {
          cleanup();
          resolve();
        }

        function onError() {
          const code = media.error ? media.error.code : '不明';
          cleanup();
          reject(new Error(`動画の読み込み・デコードに失敗しました（code: ${code}）`));
        }

        media.addEventListener('canplay', onCanPlay);
        media.addEventListener('error', onError);
        timer = setTimeout(() => {
          cleanup();
          reject(new Error('動画の再生準備がタイムアウトしました'));
        }, 90000);

        media.load();

        if (media.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
          onCanPlay();
        }
      });
    }

    async function loadVideoAfterMarker() {
      if (isLoading || isVideoReady) return;

      isLoading = true;
      retryButton.style.display = 'none';
      setProgress(0);
      setStatus('マーカーを認識しました。動画を読み込んでいます...');

      try {
        const blob = await downloadVideoBlob();

        if (videoObjectUrl) {
          URL.revokeObjectURL(videoObjectUrl);
          videoObjectUrl = null;
        }

        videoObjectUrl = URL.createObjectURL(blob);
        videoEl.src = videoObjectUrl;
        videoEl.muted = true;
        videoEl.defaultMuted = true;
        videoEl.loop = true;
        videoEl.playsInline = true;
        videoEl.preload = 'auto';

        setProgress(100, '再生準備中');
        await waitForCanPlay(videoEl);

        videoPlane.setAttribute('src', '#vid');
        videoPlane.setAttribute('visible', true);
        isVideoReady = true;
        setProgress(100, '再生可能');

        // ブラウザが自動再生を許可しない場合は、画面のボタンから再生できる。
        await playVideo();
      } catch (error) {
        console.error('動画ロードエラー:', error);

        isVideoReady = false;
        videoPlane.setAttribute('visible', false);
        setProgress(0, 'エラー');
        setStatus(`動画を読み込めませんでした。${error.message}`, 'error');

        retryButton.textContent = '動画読込を再試行';
        retryButton.style.display = 'block';

        videoEl.pause();
        videoEl.removeAttribute('src');
        videoEl.load();

        if (videoObjectUrl) {
          URL.revokeObjectURL(videoObjectUrl);
          videoObjectUrl = null;
        }
      } finally {
        isLoading = false;
      }
    }

    async function playVideo() {
      if (!isVideoReady) return;

      videoEl.muted = true;
      videoPlane.setAttribute('visible', true);

      try {
        await videoEl.play();
        retryButton.style.display = 'none';
      } catch (error) {
        console.warn('自動再生が制限されました:', error);
        setStatus('下のボタンをタップして動画を再生してください', 'error');
        retryButton.textContent = 'タップして動画を再生';
        retryButton.style.display = 'block';
      }
    }

    targetEntity.addEventListener('targetFound', () => {
      if (!isVideoReady && !isLoading) {
        loadVideoAfterMarker();
      } else if (isLoading) {
        setStatus('動画を読み込んでいます...');
      } else if (videoEl.paused) {
        playVideo();
      }
    });

    targetEntity.addEventListener('targetLost', () => {
      // 動画を停止・非表示にせず、カメラ上で表示と再生を続ける。
      if (isLoading) {
        setStatus('マーカーを見失いました。動画の読み込みは継続中です');
      } else if (isVideoReady && !videoEl.paused) {
        setStatus('マーカーを見失いましたが、動画は再生中です', 'success');
      }
    });

    videoEl.addEventListener('playing', () => {
      videoPlane.setAttribute('visible', true);
      retryButton.style.display = 'none';
      setProgress(100, '再生中');
      setStatus('動画再生中。スライドで位置を動かせます', 'success');
    });

    videoEl.addEventListener('error', () => {
      if (isLoading || !isVideoReady) return;

      isVideoReady = false;
      videoPlane.setAttribute('visible', false);
      setStatus('動画を再生できません。ボタンから再読込してください', 'error');
      retryButton.textContent = '動画を再読込';
      retryButton.style.display = 'block';
    });

    retryButton.addEventListener('click', () => {
      if (isVideoReady) {
        playVideo();
      } else {
        loadVideoAfterMarker();
      }
    });

    // スライド移動と2本指の拡大縮小
    let gestureMode = null;
    let startX = 0;
    let startY = 0;
    let startPosition = { x: 0, y: 0, z: -2.2 };
    let initialDistance = 0;
    let initialScale = 1;

    const planeWidth = 1.6;
    const planeHeight = 0.9;

    function getViewSizeAtPlane(z) {
      const cameraData = cameraEl.getAttribute('camera');
      const fov = cameraData && Number(cameraData.fov) ? Number(cameraData.fov) : 80;
      const height = 2 * Math.abs(z) * Math.tan((fov * Math.PI) / 360);
      const width = height * (window.innerWidth / window.innerHeight);
      return { width, height };
    }

    function clampVideoPosition(x, y, z, scale) {
      const view = getViewSizeAtPlane(z);
      const halfWidth = Math.max(0, (view.width - planeWidth * scale) / 2);
      const halfHeight = Math.max(0, (view.height - planeHeight * scale) / 2);

      return {
        x: Math.max(-halfWidth, Math.min(halfWidth, x)),
        y: Math.max(-halfHeight, Math.min(halfHeight, y))
      };
    }

    window.addEventListener('touchstart', (event) => {
      if (event.target instanceof Element && event.target.closest('#retryButton')) return;
      if (!isVideoReady) return;

      if (videoEl.paused) playVideo();

      if (event.touches.length === 1) {
        gestureMode = 'drag';
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;

        const position = videoPlane.getAttribute('position');
        startPosition = { x: position.x, y: position.y, z: position.z };
      } else if (event.touches.length === 2) {
        gestureMode = 'pinch';
        initialDistance = Math.hypot(
          event.touches[0].clientX - event.touches[1].clientX,
          event.touches[0].clientY - event.touches[1].clientY
        );
        const scale = videoPlane.getAttribute('scale');
        initialScale = scale ? scale.x : 1;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (event) => {
      if (!isVideoReady) return;

      if (gestureMode === 'drag' && event.touches.length === 1) {
        const view = getViewSizeAtPlane(startPosition.z);
        const worldUnitsPerPixel = view.height / window.innerHeight;
        const dx = (event.touches[0].clientX - startX) * worldUnitsPerPixel;
        const dy = (event.touches[0].clientY - startY) * worldUnitsPerPixel;

        const position = clampVideoPosition(
          startPosition.x + dx,
          startPosition.y - dy,
          startPosition.z,
          initialScale || 1
        );

        videoPlane.setAttribute('position',
          `${position.x} ${position.y} ${startPosition.z}`);
      } else if (gestureMode === 'pinch' && event.touches.length === 2 && initialDistance > 0) {
        const distance = Math.hypot(
          event.touches[0].clientX - event.touches[1].clientX,
          event.touches[0].clientY - event.touches[1].clientY
        );
        const newScale = Math.max(0.5, Math.min(1.8, initialScale * (distance / initialDistance)));
        const position = videoPlane.getAttribute('position');
        const clamped = clampVideoPosition(position.x, position.y, position.z, newScale);

        videoPlane.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
        videoPlane.setAttribute('position',
          `${clamped.x} ${clamped.y} ${position.z}`);
      }
    }, { passive: true });

    window.addEventListener('touchend', (event) => {
      if (event.touches.length === 0 || event.touches.length < 2) {
        gestureMode = null;
        initialDistance = 0;
      }
    }, { passive: true });
  </script>
</body>
</html>
