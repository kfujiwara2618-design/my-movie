<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>MindAR MP4動画・継続表示</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #000;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #info-overlay {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      max-width: 360px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 9999;
      pointer-events: none;
    }

    #status {
      font-weight: bold;
      color: #ffd700;
    }

    .success {
      color: #51cf66 !important;
    }

    .error {
      color: #ff6b6b !important;
    }

    #retryButton {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 10000;

      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      background: #1465cc;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
      pointer-events: auto;
    }
  </style>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <!-- 状態表示 -->
  <div id="info-overlay">
    <div>状態：
      <span id="status">準備中...</span>
    </div>
  </div>

  <!-- 自動再生に失敗した場合の再試行ボタン -->
  <button id="retryButton" type="button">
    動画を開始／再開
  </button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- 動画は自動再生を優先してミュートで読み込む -->
      <video
        id="vid"
        src="./video.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <!-- カメラ -->
    <a-camera
      id="camera"
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- マーカー認識用 -->
    <a-entity
      id="targetEntity"
      mindar-image-target="targetIndex: 0">

      <!-- 認識前はマーカーに紐づけておく動画面 -->
      <a-plane
        id="videoPlane"
        src="#vid"
        position="0 0 0"
        width="1.3"
        height="0.73125"
        scale="1 1 1">
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const cameraEl = document.querySelector('#camera');
    const targetEntity = document.querySelector('#targetEntity');
    const videoPlane = document.querySelector('#videoPlane');
    const videoEl = document.querySelector('#vid');
    const statusEl = document.querySelector('#status');
    const retryButton = document.querySelector('#retryButton');

    // 一度動画をカメラに移動したら、その位置を維持する
    let hasFoundMarker = false;
    let isPinnedToCamera = false;
    let playRequestPending = false;

    // 状態表示
    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = type;
    }

    // カメラ・ARの起動
    sceneEl.addEventListener('arReady', () => {
      setStatus('カメラ起動成功。マーカーをかざしてください');
    });

    sceneEl.addEventListener('arError', () => {
      setStatus(
        'AR起動エラー。カメラ権限とtargets.mindを確認してください',
        'error'
      );
    });

    // 動画をカメラの正面に固定する
    function pinVideoToCamera() {
      if (isPinnedToCamera) return;

      // DOM上の親をマーカーからカメラに変更
      cameraEl.appendChild(videoPlane);

      // カメラから見て正面、約1.8単位先に表示
      videoPlane.setAttribute('position', '0 0 -1.8');
      videoPlane.setAttribute('rotation', '0 0 0');
      videoPlane.setAttribute('scale', '1 1 1');
      videoPlane.setAttribute('visible', 'true');

      isPinnedToCamera = true;
    }

    // 動画の再生処理
    async function startVideo() {
      if (playRequestPending) return;

      playRequestPending = true;
      retryButton.style.display = 'none';

      try {
        // スマートフォンの自動再生制限に対応するためミュート
        videoEl.muted = true;
        videoEl.playsInline = true;
        videoEl.loop = true;

        // 再生を開始する
        await videoEl.play();

        setStatus(
          '動画再生中。マーカーを見失っても表示を維持します',
          'success'
        );

      } catch (error) {
        console.error('動画の再生に失敗しました:', error);

        setStatus(
          '自動再生に失敗しました。下のボタンを押してください',
          'error'
        );

        retryButton.style.display = 'block';

      } finally {
        playRequestPending = false;
      }
    }

    // マーカーを認識したとき
    targetEntity.addEventListener('targetFound', ()
