<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR 安定動画再生</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    /* 確実に動画とARを起動するためのスタート画面 */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    #start-btn {
      background: #51cf66;
      color: #ffffff;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(81, 207, 102, 0.4);
      margin-top: 20px;
    }
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 999;
      pointer-events: none;
    }
    #status { font-weight: bold; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }
  </style>

  <!-- A-Frame & MindAR の読み込み -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <!-- スマホの自動再生制限を突破するためのスタートボタン -->
  <div id="start-overlay">
    <h2>AR動画プレーヤー</h2>
    <p style="font-size: 14px; color: #ccc; max-width: 300px; line-height: 1.5;">
      ボタンを押すとカメラが起動し、動画の再生準備が完了します。
    </p>
    <button id="start-btn">タップしてARを開始</button>
  </div>

  <!-- 操作ガイドの表示 -->
  <div id="info-overlay">
    <div>状態: <span id="status">準備中...</span></div>
    <div style="margin-top: 4px; font-size: 10px; color: #aaa;">1本指スライド: 位置移動 / 2本指ピンチ: 拡大縮小</div>
  </div>

  <!-- 手ブレ（ジッター）を強力に抑える filterMinCF / filterBeta を設定 -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.0001;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- 動画読み込み (playsinline, mutedで確実な再生を担保) -->
      <video id="vid" src="video.mp4" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline muted></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- マーカーを認識したときに表示されるターゲット -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <!-- 動画を表示する板 (16:9のアスペクト比: width=1, height=0.5625) -->
      <a-plane 
        id="videoPlane" 
        src="#vid" 
        position="0 0 0" 
        width="1" 
        height="0.5625" 
        scale="1 1 1">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const statusEl = document.getElementById('status');
    const sceneEl = document.querySelector('a-scene');
    const videoPlane = document.querySelector('#videoPlane');
    const videoEl = document.querySelector('#vid');
    const targetEntity = document.querySelector('#targetEntity');

    let isVideoInitialized = false;

    // スタートボタンが押されたら、ブラウザの再生制限を解除して動画を初期化
    startBtn.addEventListener('click', () => {
      startOverlay.style.display = 'none';
      
      // 動画の再生許可を確実に取得するため一度再生して即一時停止
      videoEl.play().then(() => {
        videoEl.pause();
        videoEl.currentTime = 0;
        isVideoInitialized = true;
      }).catch(err => {
        console.log("再生初期化エラー:", err);
      });

      statusEl.textContent = "カメラ起動中... マーカーをかざしてください";
    });

    // カメラ起動・エラーの判定
    sceneEl.addEventListener("arReady", () => {
      if (isVideoInitialized) {
        statusEl.textContent = "マーカーをかざしてください";
      }
    });

    sceneEl.addEventListener("arError", () => {
      statusEl.textContent = "エラー: targets.mind の読み込み失敗";
      statusEl.className = "error";
    });
    
    // マーカーを検出したとき
    targetEntity.addEventListener('targetFound', () => {
      statusEl.textContent = "認識成功！動画再生中";
      statusEl.className = 'success';
      if (isVideoInitialized) {
        videoEl.play().catch(error => {
          console.log("再生ブロック:", error);
        });
      }
    });

    // マーカーを見失ったとき
    targetEntity.addEventListener('targetLost', () => {
      statusEl.textContent = 'マーカーを検索中...';
      statusEl.className = '';
      videoEl.pause();
    });

    // タッチ操作（1本指スライド移動 ＆ 2本指ピンチ拡大縮小）の処理
    let isDragging = false;
    let prevTouchX = 0;
    let prevTouchY = 0;
    let initialDistance = null;
    let initialScale = 1;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        prevTouchX = e.touches[0].clientX;
        prevTouchY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (videoPlane) {
          const s = videoPlane.getAttribute('scale');
          if (s) initialScale = s.x;
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!videoPlane) return;

      // 1本指でのスライド（位置移動）
      if (e.touches.length === 1 && isDragging) {
        const currentX = e.touches[0].clientX;
        const currentY = e.touches[0].clientY;
        const deltaX = (currentX - prevTouchX) * 0.002;
        const deltaY = (currentY - prevTouchY) * 0.002;

        const pos = videoPlane.getAttribute('position');
        videoPlane.setAttribute('position', `${pos.x + deltaX} ${pos.y - deltaY} ${pos.z}`);

        prevTouchX = currentX;
        prevTouchY = currentY;
      } 
      // 2本指でのピンチイン・ピンチアウト（拡大縮小）
      else if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        let newScale = Math.max(0.2, Math.min(3.0, initialScale * factor));
        videoPlane.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isDragging = false;
      }
      initialDistance = null;
    });
  </script>
</body>
</html>
